name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Provision admitted Node 22 at production path
        # The lifecycle-lock re-entry and host-launcher CLI tests exec the
        # frozen production node path (/opt/nodejs/node-v22.23.1/bin/node)
        # through a real bash + flock + exec boundary. GitHub runners do not
        # ship that path, so materialize the exact admitted Node 22.23.1
        # distribution there before running the suite.
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/nodejs
          curl -fsSL --retry 3 https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz \
            -o /tmp/node-v22.23.1-linux-x64.tar.xz
          sudo tar -xJf /tmp/node-v22.23.1-linux-x64.tar.xz -C /opt/nodejs
          sudo mv /opt/nodejs/node-v22.23.1-linux-x64 /opt/nodejs/node-v22.23.1
          /opt/nodejs/node-v22.23.1/bin/node --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:all

      - name: Run release gate summary
        run: npm run gate:ci -- --json

      - name: Profile CLI smoke
        run: |
          npm run rebuild-profile -- --dry-run --json
          npm run profile-health
          npm run profile-gate -- --json --summary-only
          npm run v8-diagnose -- --query "[[checkpoint vector schema migration]] ::TagMemo+1.5"

  exact-vcp-writer:
    name: Exact VCP writer authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout codex-memory
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact VCPToolBox baseline
        uses: actions/checkout@v6
        with:
          repository: lioensky/VCPToolBox
          ref: 555b3b538f6eb736e530c2912de678c5941f9985
          path: .exact-vcp/VCPToolBox
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install codex-memory dependencies
        run: npm ci

      - name: Install exact VCP writer dependencies
        working-directory: .exact-vcp/VCPToolBox
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --ignore-scripts --omit=optional
          npm rebuild better-sqlite3

      - name: Run exact VCP writer authority harness
        run: |
          node scripts/run-exact-vcp-writer-harness.js \
            --vcp-root "$GITHUB_WORKSPACE/.exact-vcp/VCPToolBox" \
            --expected-sha 555b3b538f6eb736e530c2912de678c5941f9985 \
            --json
